name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # Fork version policy (docs/fork/RELEASING.md): only vX.0.Z with X >= 1 is a normal
      # release; 0.y.z, x.y.z with y >= 1 and rc tags are pre-releases. The release text is
      # docs/releases/release-<version>.md, written by scripts/release.ps1.
      - id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" -ge 1 ] && [ "${BASH_REMATCH[2]}" -eq 0 ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          notes="docs/releases/release-$version.md"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            if [ -f "$notes" ]; then cat "$notes"; else echo "Release $GITHUB_REF_NAME"; fi
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.meta.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
