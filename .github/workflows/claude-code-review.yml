# Claude reviews every pull request into 'stable', a release branch (release/x.y.z), fork/* or feature/*.
#   verdict  - one Claude run: runs the official code-review plugin, checks the changes against
#              the review rules in the prompt, posts an inline comment on the exact line of each
#              problem, then returns { blocking, summary, checked }. Every comment must be fixed
#              in the same pull request, so any problem is blocking. Fails when blocking. Make
#              "claude-verdict" a required status check on 'stable' (docs/release/RELEASING.md).
#   decision - no blocking issues: approves with a short note (why, and what was checked).
#              Other PRs (features into a release, fixes into fork/* or feature/*) are then merged; a release PR
#              (release/x.y.z -> stable) is labelled ready-to-promote instead, because a release replaces stable.
#              Any problem: requests changes and labels the PR waiting-for-author.
# Billed to the Claude subscription behind the CLAUDE_CODE_OAUTH_TOKEN secret.
name: Claude Code Review

on:
  pull_request:
    branches: [stable, 'release/**', 'fork/**', 'feature/**']
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verdict:
    name: claude-verdict
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      verdict: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # The review must wait for the plugin's agents; run in the background, it answers without them.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Merges by claude-decision push to release branches as github-actions[bot]; without
          # this the action refuses the review that push starts ("non-human actor").
          allowed_bots: github-actions
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: |
            You review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }},
            which would bring changes into the '${{ github.base_ref }}' branch (the fork's released versions).
            See the changes with `git diff origin/${{ github.base_ref }}...HEAD` and read any files you need.

            Every comment you post must be fixed in this pull request before it can merge: there are
            no optional suggestions and no follow-up pull requests. So comment only on real problems
            worth holding the merge for, and don't invent any: each comment points at concrete code
            and says when it goes wrong. Approving means you checked and found nothing, not that you
            skimmed the diff.

            Step 1: run the code-review plugin. Use the Skill tool for
            code-review:code-review with ${{ github.repository }}/pull/${{ github.event.pull_request.number }},
            without --comment, so it reports its validated issues back to you. Follow its steps as
            written and launch its agents with the Agent tool on every pull request, however small;
            reading the diff yourself does not replace them. Only ignore its checks that stop on
            "already commented", "automated" or "trivial". Wait for every agent to finish and use
            its result before you go on: never answer while one is still running. If its review
            agents can't run or finish, answer blocking: true and say exactly why in `summary`, so
            the pull request can't merge on an incomplete review.

            Step 2: check every changed file against these rules, reading the code around each
            change (callers, types, templates, the store or command it talks to):
            1. Correctness - wrong conditions, off-by-one, unhandled null/undefined/empty values,
               wrong units, async code without await, stale or shared state, race conditions.
            2. Cleanup - event listeners, timers, intervals, observers and subscriptions are removed
               when their component or task ends; nothing grows without bound (caches, arrays,
               localStorage, log files).
            3. Errors - failures are handled and visible; no empty catch that hides real errors; no
               panic/unwrap/expect in Rust on data from files, the network or the game log.
            4. Security and privacy - no secrets, tokens or other players' names/IDs committed,
               logged or sent anywhere; no unchecked input in paths, URLs or shell commands; Tauri
               commands validate their arguments.
            5. Saved data - settings and state saved by older versions still load (new fields have
               defaults, renamed keys are migrated); nothing a user saved is lost.
            6. Performance - no heavy work in hot paths (per frame, per log line, per render) that
               could be cached; no request bursts against external APIs.
            7. Consistency - follows CLAUDE.md and the surrounding code's patterns; reuses existing
               helpers instead of duplicating them; no dead code, debug output or commented-out
               code left behind.
            8. UI - text fits (long item names, big numbers), controls have labels, layouts hold at
               the sizes the feature supports.
            9. Docs and tests - user-visible behaviour changes are reflected in docs/features/;
               Rust logic changes keep or extend the #[cfg(test)] tests next to them.
            10. Release tooling and workflows - scripts and workflows keep working (flags,
               permissions, paths, branch names).

            Step 3: for the problems from steps 1 and 2 together:
            a. Read the review comments already on this pull request with
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
               and check each one against the code in this commit. A comment whose problem is gone
               no longer counts, whatever line or commit GitHub still shows it on.
            b. For every problem not already commented on, post ONE inline comment on the exact line
               with mcp__github_inline_comment__create_inline_comment (path and line in the new
               version of the file). Say what is wrong, when it goes wrong, and how to fix it in two
               or three sentences. Skip pure formatting and naming taste. Don't comment on lines the
               PR doesn't change unless the change breaks them.
            c. Answer with:
               - blocking: true only if a problem exists in the code of this commit, including one
                 commented on earlier that you checked and found still not fixed; otherwise false
               - summary: one or two sentences - why it can or can't be released
               - checked: 4 to 8 short items naming what you verified, by rule, and how many
                 code-review plugin agents finished (e.g. "listeners removed on unmount")
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Skill,Agent,Task,TodoWrite,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"},"checked":{"type":"array","items":{"type":"string"}}},"required":["blocking","summary","checked"]}'

      - name: Report verdict
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: |
          if [ -z "$VERDICT" ]; then
            # The action skips itself when this workflow file differs from the copy on the
            # default branch (stable), e.g. on the PR that changes the workflow itself.
            echo "::error::Claude returned no verdict. If this PR changes .github/workflows/claude-code-review.yml, the review is skipped until that change is on stable - see docs/release/RELEASING.md."
            exit 1
          fi
          echo "$VERDICT" | jq -r '"## Claude verdict: " + (if .blocking then "blocking issues" else "no blocking issues" end) + "\n\n" + .summary + "\n\n**Checked:**\n" + ([.checked[] | "- " + .] | join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          if [ "$(echo "$VERDICT" | jq -r '.blocking')" = "true" ]; then
            echo "::error::Claude found blocking issues - see the inline comments on the pull request"
            exit 1
          fi

  decision:
    name: claude-decision
    needs: [verdict]
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      VERDICT: ${{ needs.verdict.outputs.verdict }}
    steps:
      - name: Approve and merge, or request changes
        run: |
          gh label create waiting-for-author --color FBCA04 --description "Claude review found problems; waiting for fixes" --force >/dev/null
          gh label create ready-to-promote --color 0E8A16 --description "Release passed Claude review; run release.ps1 -Promote" --force >/dev/null

          # Only act on the commit that was reviewed; a newer push starts its own run.
          current=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The pull request moved on to $current; leaving the decision to that run."
            exit 0
          fi

          if [ -z "$VERDICT" ]; then
            blocking=unknown
            summary="Claude could not produce a verdict for this commit. If this pull request changes .github/workflows/claude-code-review.yml, the review is skipped until that change is on stable (see docs/release/RELEASING.md). Otherwise check the claude-verdict job log."
            checked=""
          else
            blocking=$(jq -r '.blocking' <<<"$VERDICT")
            summary=$(jq -r '.summary' <<<"$VERDICT")
            checked=$(jq -r '.checked[] | "- " + .' <<<"$VERDICT")
          fi

          if [ "$blocking" = "false" ]; then
            gh pr edit "$PR" --remove-label waiting-for-author >/dev/null 2>&1 || true
            printf '**Approved by Claude review.** %s\n\n**Checked:**\n%s\n' "$summary" "$checked" > body.md
            # A new approval from the same reviewer replaces an earlier "changes requested".
            if ! gh pr review "$PR" --approve --body-file body.md; then
              echo "::warning::Could not approve. Enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General."
              gh pr comment "$PR" --body-file body.md
            fi
            case "$HEAD_REF" in
              release/*)
                gh pr edit "$PR" --add-label ready-to-promote >/dev/null
                gh pr comment "$PR" --body "Ready to release. Run \`.\\scripts\\release.ps1 -Promote ${HEAD_REF#release/}\`. Do not press Merge: a release replaces stable."
                ;;
              *)
                gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"
                ;;
            esac
          else
            gh pr edit "$PR" --remove-label ready-to-promote >/dev/null 2>&1 || true
            gh pr edit "$PR" --add-label waiting-for-author >/dev/null
            if [ -n "$checked" ]; then
              printf '**Changes needed.** %s\n\nEvery inline comment must be fixed in this pull request. Push fixes to this branch; the review runs again and, once it passes, approves and merges automatically.\n\n**Checked:**\n%s\n' "$summary" "$checked" > body.md
            else
              printf '**Changes needed.** %s\n' "$summary" > body.md
            fi
            if ! gh pr review "$PR" --request-changes --body-file body.md; then
              gh pr comment "$PR" --body-file body.md
            fi
          fi
