# Claude reviews every pull request into 'stable'.
#   review   - posts inline comments on the changed lines (code-review plugin)
#   verdict  - returns { blocking, summary }; fails when blocking. Make "claude-verdict"
#              a required status check on 'stable' (see docs/fork/RELEASING.md).
#   decision - no blocking issues: approves, then merges (release/* PRs are only approved
#              and labelled ready-to-promote, because a release replaces stable).
#              Blocking issues: requests changes and labels the PR waiting-for-author.
# Billed to the Claude subscription behind the CLAUDE_CODE_OAUTH_TOKEN secret.
name: Claude Code Review

on:
  pull_request:
    branches: [stable]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

  verdict:
    name: claude-verdict
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      verdict: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the release gate for this repository's 'stable' branch.
            Review the changes this pull request would bring into stable:
            run `git diff origin/${{ github.base_ref }}...HEAD` and read any files you need.

            Decide whether anything must be fixed before this is released:
            blocking = true only for real defects - bugs that break the app, build or
            type errors, security problems, data loss, or broken release tooling.
            Style, naming and nice-to-have suggestions are NOT blocking.
            Put a short explanation in summary, listing each blocking problem with file and line.
          claude_args: >-
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"}},"required":["blocking","summary"]}'

      - name: Report verdict
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: |
          if [ -z "$VERDICT" ]; then
            # The action skips itself when this workflow file differs from the copy on the
            # default branch (stable), e.g. on the PR that changes the workflow itself.
            echo "::error::Claude returned no verdict. If this PR changes .github/workflows/claude-code-review.yml, the review is skipped until that change is on stable - see docs/fork/RELEASING.md."
            exit 1
          fi
          blocking=$(echo "$VERDICT" | jq -r '.blocking')
          echo "$VERDICT" | jq -r '"## Claude verdict: " + (if .blocking then "blocking issues" else "no blocking issues" end) + "\n\n" + .summary' >> "$GITHUB_STEP_SUMMARY"
          if [ "$blocking" = "true" ]; then
            echo "::error::Claude found blocking issues - see the job summary and the review comments"
            exit 1
          fi

  decision:
    name: claude-decision
    needs: [review, verdict]
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      VERDICT: ${{ needs.verdict.outputs.verdict }}
    steps:
      - name: Approve and merge, or request changes
        run: |
          gh label create waiting-for-author --color FBCA04 --description "Claude review found problems; waiting for fixes" --force >/dev/null
          gh label create ready-to-promote --color 0E8A16 --description "Release passed Claude review; run release.ps1 -Promote" --force >/dev/null

          # Only act on the commit that was reviewed; a newer push starts its own run.
          current=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The pull request moved on to $current; leaving the decision to that run."
            exit 0
          fi

          if [ -z "$VERDICT" ]; then
            blocking=unknown
            summary="Claude could not produce a verdict for this commit. If this pull request changes .github/workflows/claude-code-review.yml, the review is skipped until that change is on stable (see docs/fork/RELEASING.md). Otherwise check the claude-verdict job log."
          else
            blocking=$(jq -r '.blocking' <<<"$VERDICT")
            summary=$(jq -r '.summary' <<<"$VERDICT")
          fi

          if [ "$blocking" = "false" ]; then
            gh pr edit "$PR" --remove-label waiting-for-author >/dev/null 2>&1 || true
            printf '### Claude review: no blocking issues\n\n%s\n' "$summary" > body.md
            # A new approval from the same reviewer replaces an earlier "changes requested".
            if ! gh pr review "$PR" --approve --body-file body.md; then
              echo "::warning::Could not approve. Enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General."
              gh pr comment "$PR" --body-file body.md
            fi
            case "$HEAD_REF" in
              release/*)
                gh pr edit "$PR" --add-label ready-to-promote >/dev/null
                gh pr comment "$PR" --body "Ready to release. Run \`.\scripts\release.ps1 -Promote ${HEAD_REF#release/}\`. Do not press Merge: a release replaces stable."
                ;;
              *)
                gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"
                ;;
            esac
          else
            gh pr edit "$PR" --remove-label ready-to-promote >/dev/null 2>&1 || true
            gh pr edit "$PR" --add-label waiting-for-author >/dev/null
            printf '### Claude review: changes needed\n\n%s\n\nPush fixes to this branch. The review runs again and, once it passes, approves and merges automatically.\n' "$summary" > body.md
            if ! gh pr review "$PR" --request-changes --body-file body.md; then
              gh pr comment "$PR" --body-file body.md
            fi
          fi
