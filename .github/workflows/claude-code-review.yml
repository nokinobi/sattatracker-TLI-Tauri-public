# Claude reviews every pull request into 'stable'.
#   verdict  - one Claude run: posts an inline comment on the exact line of each problem,
#              then returns { blocking, summary, checked }. Fails when blocking. Make
#              "claude-verdict" a required status check on 'stable' (docs/fork/RELEASING.md).
#   decision - no blocking issues: approves with a short note (why, and what was checked),
#              then merges. release/* PRs are only approved and labelled ready-to-promote,
#              because a release replaces stable.
#              Blocking issues: requests changes and labels the PR waiting-for-author.
# Billed to the Claude subscription behind the CLAUDE_CODE_OAUTH_TOKEN secret.
name: Claude Code Review

on:
  pull_request:
    branches: [stable]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verdict:
    name: claude-verdict
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    outputs:
      verdict: ${{ steps.claude.outputs.structured_output }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }},
            which would bring changes into the 'stable' branch (the fork's released version).
            See the changes with `git diff origin/${{ github.base_ref }}...HEAD` and read any files you need.

            1. For every problem you find, post ONE inline comment on the exact line with
               mcp__github_inline_comment__create_inline_comment (path and line in the new
               version of the file). Start the body with "**Blocking:**" for real defects -
               bugs that break the app, build or type errors, security problems, data loss,
               broken release tooling - or "**Suggestion:**" for anything else. Say what is
               wrong and how to fix it in two or three sentences. At most 3 suggestions;
               skip pure style and naming. Don't comment on lines the PR doesn't change
               unless the change breaks them.
            2. Then answer with:
               - blocking: true if any Blocking comment was posted, otherwise false
               - summary: one or two sentences - why it can or can't be released
               - checked: 3 to 6 short items naming what you verified
                 (e.g. "release.ps1 flag handling", "workflow permissions")
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"},"checked":{"type":"array","items":{"type":"string"}}},"required":["blocking","summary","checked"]}'

      - name: Report verdict
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: |
          if [ -z "$VERDICT" ]; then
            # The action skips itself when this workflow file differs from the copy on the
            # default branch (stable), e.g. on the PR that changes the workflow itself.
            echo "::error::Claude returned no verdict. If this PR changes .github/workflows/claude-code-review.yml, the review is skipped until that change is on stable - see docs/fork/RELEASING.md."
            exit 1
          fi
          echo "$VERDICT" | jq -r '"## Claude verdict: " + (if .blocking then "blocking issues" else "no blocking issues" end) + "\n\n" + .summary + "\n\n**Checked:**\n" + ([.checked[] | "- " + .] | join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          if [ "$(echo "$VERDICT" | jq -r '.blocking')" = "true" ]; then
            echo "::error::Claude found blocking issues - see the inline comments on the pull request"
            exit 1
          fi

  decision:
    name: claude-decision
    needs: [verdict]
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      VERDICT: ${{ needs.verdict.outputs.verdict }}
    steps:
      - name: Approve and merge, or request changes
        run: |
          gh label create waiting-for-author --color FBCA04 --description "Claude review found problems; waiting for fixes" --force >/dev/null
          gh label create ready-to-promote --color 0E8A16 --description "Release passed Claude review; run release.ps1 -Promote" --force >/dev/null

          # Only act on the commit that was reviewed; a newer push starts its own run.
          current=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "The pull request moved on to $current; leaving the decision to that run."
            exit 0
          fi

          if [ -z "$VERDICT" ]; then
            blocking=unknown
            summary="Claude could not produce a verdict for this commit. If this pull request changes .github/workflows/claude-code-review.yml, the review is skipped until that change is on stable (see docs/fork/RELEASING.md). Otherwise check the claude-verdict job log."
            checked=""
          else
            blocking=$(jq -r '.blocking' <<<"$VERDICT")
            summary=$(jq -r '.summary' <<<"$VERDICT")
            checked=$(jq -r '.checked[] | "- " + .' <<<"$VERDICT")
          fi

          if [ "$blocking" = "false" ]; then
            gh pr edit "$PR" --remove-label waiting-for-author >/dev/null 2>&1 || true
            printf '**Approved by Claude review.** %s\n\n**Checked:**\n%s\n' "$summary" "$checked" > body.md
            # A new approval from the same reviewer replaces an earlier "changes requested".
            if ! gh pr review "$PR" --approve --body-file body.md; then
              echo "::warning::Could not approve. Enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General."
              gh pr comment "$PR" --body-file body.md
            fi
            case "$HEAD_REF" in
              release/*)
                gh pr edit "$PR" --add-label ready-to-promote >/dev/null
                gh pr comment "$PR" --body "Ready to release. Run \`.\\scripts\\release.ps1 -Promote ${HEAD_REF#release/}\`. Do not press Merge: a release replaces stable."
                ;;
              *)
                gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"
                ;;
            esac
          else
            gh pr edit "$PR" --remove-label ready-to-promote >/dev/null 2>&1 || true
            gh pr edit "$PR" --add-label waiting-for-author >/dev/null
            if [ -n "$checked" ]; then
              printf '**Changes needed.** %s\n\nDetails are in the inline comments marked **Blocking**. Push fixes to this branch; the review runs again and, once it passes, approves and merges automatically.\n\n**Checked:**\n%s\n' "$summary" "$checked" > body.md
            else
              printf '**Changes needed.** %s\n' "$summary" > body.md
            fi
            if ! gh pr review "$PR" --request-changes --body-file body.md; then
              gh pr comment "$PR" --body-file body.md
            fi
          fi
