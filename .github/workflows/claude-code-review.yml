# Claude reviews every pull request into 'stable'.
#   review   - posts inline comments and a summary on the PR (code-review plugin)
#   verdict  - returns { blocking, summary }; fails when blocking. Make "claude-verdict"
#              a required status check on 'stable' (see docs/fork/RELEASING.md).
# Billed to the Claude subscription behind the CLAUDE_CODE_OAUTH_TOKEN secret.
name: Claude Code Review

on:
  pull_request:
    branches: [stable]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: claude-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

  verdict:
    name: claude-verdict
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the release gate for this repository's 'stable' branch.
            Review the changes this pull request would bring into stable:
            run `git diff origin/${{ github.base_ref }}...HEAD` and read any files you need.

            Decide whether anything must be fixed before this is released:
            blocking = true only for real defects - bugs that break the app, build or
            type errors, security problems, data loss, or broken release tooling.
            Style, naming and nice-to-have suggestions are NOT blocking.
            Put a short explanation in summary, listing each blocking problem with file and line.
          claude_args: >-
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"}},"required":["blocking","summary"]}'

      - name: Report verdict
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: |
          if [ -z "$VERDICT" ]; then
            # The action skips itself when this workflow file differs from the copy on the
            # default branch (stable), e.g. on the PR that changes the workflow itself.
            echo "::error::Claude returned no verdict. If this PR changes .github/workflows/claude-code-review.yml, the review is skipped until that change is on stable - see docs/fork/RELEASING.md."
            exit 1
          fi
          blocking=$(echo "$VERDICT" | jq -r '.blocking')
          echo "$VERDICT" | jq -r '"## Claude verdict: " + (if .blocking then "blocking issues" else "no blocking issues" end) + "\n\n" + .summary' >> "$GITHUB_STEP_SUMMARY"
          if [ "$blocking" = "true" ]; then
            echo "::error::Claude found blocking issues - see the job summary and the review comments"
            exit 1
          fi
